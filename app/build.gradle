plugins { id 'com.android.application' }

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.stayclean'
    compileSdk 34

    defaultConfig {
        applicationId 'com.stayclean.guard'
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }
    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // Signed only when keystore.properties exists (see docs/BUILDING.md); otherwise an unsigned APK is produced.
            if (keystoreProps['storeFile']) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { checkReleaseBuilds false }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
