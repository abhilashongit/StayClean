name: bootstrap
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project, push, publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          if [ ! -f StayClean.zip ]; then echo "Nothing to unpack"; exit 0; fi
          cp stay-clean-v1.3.apk /tmp/stay-clean-v1.3.apk
          unzip -q StayClean.zip -d /tmp/x
          rm -rf /tmp/x/StayClean/.github/workflows
          cp -a /tmp/x/StayClean/. .
          rm -f StayClean.zip stay-clean-v1.3.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Stay Clean v1.3 source, docs and assets"
          git push origin HEAD:main
          SUM=$(sha256sum /tmp/stay-clean-v1.3.apk | cut -d' ' -f1)
          printf 'Stay Clean v1.3\n\nDownload **stay-clean-v1.3.apk** below and follow [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/main/docs/INSTALL.md).\n\nSHA-256: `%s`\n' "$SUM" > /tmp/notes.md
          gh release create v1.3 /tmp/stay-clean-v1.3.apk --title "Stay Clean v1.3" --notes-file /tmp/notes.md --target "$(git rev-parse HEAD)"
