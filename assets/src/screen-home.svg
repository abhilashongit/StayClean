<text x="28" y="214" font-family='Inter, Helvetica, Arial, sans-serif' font-size="15" font-weight="500" fill="#eee">Night lock</text><text x="28" y="233" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="300" fill="#888">Instagram and X, 11 pm to 5 am</text>
<rect x="282" y="205" width="50" height="28" rx="14" fill="#fff"/><circle cx="318" cy="219" r="10" fill="#000"/>
<line x1="28" y1="252" x2="332" y2="252" stroke="#1c1c1c"/>
<text x="28" y="278" font-family='Inter, Helvetica, Arial, sans-serif' font-size="15" font-weight="500" fill="#eee">Instagram limit</text><text x="28" y="297" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="300" fill="#888">5 minutes in every 30</text><text x="332" y="278" font-family='Inter, Helvetica, Arial, sans-serif' font-size="13" fill="#777" text-anchor="end">Always</text>
<text x="28" y="344" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="500" fill="#777" letter-spacing="3">SETUP</text>
