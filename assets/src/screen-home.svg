<svg xmlns="http://www.w3.org/2000/svg" width="360" height="740" viewBox="0 0 360 740"><rect x="2" y="2" width="356" height="736" rx="44" fill="#000" stroke="#2a2a2a" stroke-width="4"/><text x="28" y="86" font-family='Inter, Helvetica, Arial, sans-serif' font-size="26" font-weight="600" fill="#fff" letter-spacing="7">STAY CLEAN</text>
<text x="28" y="116" font-family='Inter, Helvetica, Arial, sans-serif' font-size="13" font-weight="300" fill="#9a9a9a">Swiggy and Zomato stay closed</text>
<text x="28" y="134" font-family='Inter, Helvetica, Arial, sans-serif' font-size="13" font-weight="300" fill="#9a9a9a">from 12 am to 5 am IST.</text>
<text x="28" y="168" font-family='Inter, Helvetica, Arial, sans-serif' font-size="12" font-weight="500" fill="#fff" letter-spacing="1">Open now</text>
