<text x="28" y="608" font-family='Inter, Helvetica, Arial, sans-serif' font-size="12" fill="#666">5</text>
<text x="52" y="608" font-family='Inter, Helvetica, Arial, sans-serif' font-size="15" font-weight="500" fill="#eee">Stay alive</text>
<text x="52" y="627" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="300" fill="#888">Battery: unrestricted</text>
<text x="332" y="608" font-family='Inter, Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#fff" text-anchor="end">On</text><line x1="28" y1="642" x2="332" y2="642" stroke="#1c1c1c"/>
<text x="28" y="664" font-family='Inter, Helvetica, Arial, sans-serif' font-size="12" fill="#666">6</text>
<text x="52" y="664" font-family='Inter, Helvetica, Arial, sans-serif' font-size="15" font-weight="500" fill="#eee">Guard</text>
<text x="52" y="683" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="300" fill="#888">Accessibility, closes the apps instantly</text>
