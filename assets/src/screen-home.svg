<text x="28" y="384" font-family='Inter, Helvetica, Arial, sans-serif' font-size="12" fill="#666">1</text>
<text x="52" y="384" font-family='Inter, Helvetica, Arial, sans-serif' font-size="15" font-weight="500" fill="#eee">Notifications</text>
<text x="52" y="403" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="300" fill="#888">Keeps the guard visible and alive</text>
<text x="332" y="384" font-family='Inter, Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#fff" text-anchor="end">On</text><line x1="28" y1="418" x2="332" y2="418" stroke="#1c1c1c"/>
