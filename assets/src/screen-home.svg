<text x="52" y="440" font-family='Inter, Helvetica, Arial, sans-serif' font-size="15" font-weight="500" fill="#eee">Cover screen</text>
<text x="52" y="459" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="300" fill="#888">Display over other apps</text>
<text x="332" y="440" font-family='Inter, Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#fff" text-anchor="end">On</text><line x1="28" y1="474" x2="332" y2="474" stroke="#1c1c1c"/>
<text x="28" y="496" font-family='Inter, Helvetica, Arial, sans-serif' font-size="12" fill="#666">3</text>
<text x="52" y="496" font-family='Inter, Helvetica, Arial, sans-serif' font-size="15" font-weight="500" fill="#eee">Backup guard</text>
<text x="52" y="515" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="300" fill="#888">Usage access, takes over if Guard stops</text>
<text x="332" y="496" font-family='Inter, Helvetica, Arial, sans-serif' font-size="13" font-weight="600" fill="#fff" text-anchor="end">On</text><line x1="28" y1="530" x2="332" y2="530" stroke="#1c1c1c"/>
<text x="28" y="552" font-family='Inter, Helvetica, Arial, sans-serif' font-size="12" fill="#666">4</text>
<text x="52" y="552" font-family='Inter, Helvetica, Arial, sans-serif' font-size="15" font-weight="500" fill="#eee">Lock uninstall</text>
<text x="52" y="571" font-family='Inter, Helvetica, Arial, sans-serif' font-size="11" font-weight="300" fill="#888">Device admin, uninstall needs it removed first</text>
